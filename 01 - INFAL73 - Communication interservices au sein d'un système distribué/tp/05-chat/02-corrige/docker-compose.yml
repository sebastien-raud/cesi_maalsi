# Même nom de projet pour tous les TP : lancer un TP remplace les conteneurs du précédent
name: colibri

services:
  # Service colis : le corrigé du TP 3, sans modification
  parcels:
    image: node:26-alpine
    user: node
    working_dir: /app
    volumes:
      - ../../03-flux-evenements/02-corrige:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"

  # Service de chat (WebSocket), le code du dossier est monté dans le conteneur
  chat:
    image: node:26-alpine
    user: node
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm start"
    environment:
      # Bonus : adresse du webhook du marchand
      MERCHANT_WEBHOOK_URL: http://merchant:4100/webhooks/colibri
    ports:
      - "4000:4000"

  # Bonus : faux serveur du marchand Vélo Boutique, qui reçoit les webhooks
  merchant:
    image: node:26-alpine
    user: node
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm run merchant"
    ports:
      - "4100:4100"

  # Écrans web fournis (client, livreur, central, marchand)
  clients:
    image: node:26-alpine
    user: node
    working_dir: /app
    volumes:
      - ../../clients:/app
    command: sh -c "npm install && npm run dev"
    environment:
      PARCELS_URL: http://parcels:3000
      CHAT_URL: http://chat:4000
    ports:
      - "5173:5173"
