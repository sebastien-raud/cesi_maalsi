<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
    #status, #typing { color: gray; }
    #typing { font-style: italic; min-height: 1.5em; }
    #messages { list-style: none; padding: 0; min-height: 10rem; }
  </style>
  <!-- RxJS servi par server.js : expose l'objet global rxjs -->
  <script src="/rxjs.js"></script>
</head>
<body>
  <h1>Chat</h1>
  <p id="status">connexion…</p>
  <ul id="messages"></ul>
  <p id="typing"></p>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="Votre message" required>
    <button>Envoyer</button>
  </form>

  <script>
    const { fromEvent, of, concat, timer, map, filter, throttleTime, groupBy, mergeMap, switchMap, scan } = rxjs;

    // Pseudo demandé à l'ouverture de l'onglet
    const name = prompt('Votre pseudo ?') || 'anonyme';
    const status = document.getElementById('status');
    const input = document.getElementById('text');

    // Ouvre la connexion WebSocket sur le même serveur que la page (ws://localhost:3000)
    const socket = new WebSocket(`ws://${location.host}`);
    const send = (message) => socket.send(JSON.stringify(message));

    socket.onopen = () => { status.textContent = `connecté en tant que ${name}`; };
    socket.onclose = () => { status.textContent = 'déconnecté'; };

    // Émetteur : chaque frappe produit un événement, mais au plus un « typing » par seconde part sur le réseau
    fromEvent(input, 'input').pipe(
      throttleTime(1000)
    ).subscribe(() => send({ type: 'typing', name }));

    // Tous les messages reçus du serveur, sous forme d'Observable
    const incoming$ = fromEvent(socket, 'message').pipe(
      map((event) => JSON.parse(event.data))
    );

    // Messages du chat : ajoutés à la liste
    incoming$.pipe(
      filter((message) => message.type === 'message')
    ).subscribe((message) => {
      const item = document.createElement('li');
      item.textContent = `${message.name} : ${message.text}`;
      document.getElementById('messages').append(item);
    });

    // Indicateur « XXX écrit… » : un flux par utilisateur, chacun avec son propre délai
    incoming$.pipe(
      filter((message) => message.name !== name),
      groupBy((message) => message.name),
      mergeMap((user$) => user$.pipe(
        // Chaque nouvel événement annule le délai en cours (switchMap) et en relance un
        switchMap((message) => message.type === 'typing'
          ? concat(of(true), timer(2000).pipe(map(() => false))) // éteint après 2 s sans frappe
          : of(false)),                                          // message envoyé : éteint tout de suite
        map((typing) => ({ name: user$.key, typing }))
      )),
      // Ensemble des pseudos qui écrivent en ce moment
      scan((writers, { name: writer, typing }) => {
        const next = new Set(writers);
        typing ? next.add(writer) : next.delete(writer);
        return next;
      }, new Set())
    ).subscribe((writers) => {
      const names = [...writers];
      document.getElementById('typing').textContent =
        names.length === 0 ? '' : `${names.join(', ')} ${names.length > 1 ? 'écrivent' : 'écrit'}…`;
    });

    // Envoi : sur la même connexion que la réception (full-duplex)
    document.getElementById('form').onsubmit = (event) => {
      event.preventDefault();
      send({ type: 'message', name, text: input.value });
      input.value = '';
    };
  </script>
</body>
</html>
