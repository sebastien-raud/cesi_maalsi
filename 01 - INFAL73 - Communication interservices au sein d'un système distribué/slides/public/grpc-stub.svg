<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300"><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect x="20" y="110" width="240" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="140" y="147" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Code client</text><text x="140" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">appel de fonction</text><rect x="340" y="110" width="240" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="460" y="147" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Stub client</text><text x="460" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">tiré du .proto</text><rect x="820" y="110" width="240" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="940" y="147" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Serveur gRPC</text><text x="940" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">tiré du .proto</text><rect x="1140" y="110" width="240" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="1260" y="147" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Implémentation</text><text x="1260" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">code métier</text><path d="M260,160 L340,160" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#an)"/><path d="M1060,160 L1140,160" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#an)"/><path d="M580,160 L820,160" fill="none" stroke="#111" stroke-width="4.5" marker-end="url(#ab)" marker-start="url(#ab)"/><text x="700" y="130" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">réseau</text><text x="700" y="195" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">HTTP/2, Protobuf</text><text x="140" y="60" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#333" text-anchor="middle" dominant-baseline="middle" font-style="italic">weather.getForecast({ city })</text><text x="700" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">le stub sérialise, envoie, attend la réponse, désérialise</text></svg>
