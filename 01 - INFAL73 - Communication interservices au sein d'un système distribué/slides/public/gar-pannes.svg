<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect x="20" y="60" width="260" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="150" y="110" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Producteur</text><rect x="570" y="60" width="260" height="100" rx="10" fill="none" stroke="#111" stroke-width="4"/><text x="700" y="110" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Broker</text><rect x="1120" y="60" width="260" height="100" rx="10" fill="none" stroke="#111" stroke-width="2.5"/><text x="1250" y="110" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle" font-weight="700">Consommateur</text><path d="M280,95 L570,95" fill="none" stroke="#111" stroke-width="4.5" marker-end="url(#ab)"/><text x="425" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">publication</text><path d="M570,130 L280,130" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#an)"/><text x="425" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">confirmation</text><path d="M830,95 L1120,95" fill="none" stroke="#111" stroke-width="4.5" marker-end="url(#ab)"/><text x="975" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">livraison</text><path d="M1120,130 L830,130" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#an)"/><text x="975" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#333" text-anchor="middle" dominant-baseline="middle">ack</text><circle cx="425" cy="112" r="20" fill="#111"/><text x="425" y="113" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">1</text><circle cx="700" cy="190" r="20" fill="#111"/><text x="700" y="191" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">2</text><circle cx="975" cy="112" r="20" fill="#111"/><text x="975" y="113" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">3</text><circle cx="60" cy="270" r="20" fill="#111"/><text x="60" y="271" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">1</text><text x="100" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" dominant-baseline="middle">le message n'arrive pas au broker : perte, ou renvoi et doublon</text><circle cx="60" cy="330" r="20" fill="#111"/><text x="60" y="331" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">2</text><text x="100" y="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" dominant-baseline="middle">le broker redémarre : perte si la queue ou le message ne sont pas durables</text><circle cx="60" cy="390" r="20" fill="#111"/><text x="60" y="391" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">3</text><text x="100" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#111" text-anchor="start" dominant-baseline="middle">le consommateur tombe avant l'ack : relivraison, donc doublon possible</text></svg>
